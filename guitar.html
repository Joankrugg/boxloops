<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernLoops</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Création de 24 carrés avec une classe 'loop-box' et un id unique pour chacun -->
        <div class="loop-box" id="loop1"></div>
        <div class="loop-box" id="loop2"></div>
        <div class="loop-box" id="loop3"></div>
        <div class="loop-box" id="loop4"></div>
        <div class="loop-box" id="loop5"></div>
        <div class="loop-box" id="loop6"></div>
        <div class="loop-box" id="loop7"></div>
        <div class="loop-box" id="loop8"></div>
        <div class="loop-box" id="loop9"></div>
        <div class="loop-box" id="loop10"></div>
        <div class="loop-box" id="loop11"></div>
        <div class="loop-box" id="loop12"></div>
        <div class="loop-box" id="loop13"></div>
        <div class="loop-box" id="loop14"></div>
        <div class="loop-box" id="loop15"></div>
        <div class="loop-box" id="loop16"></div>
        <div class="loop-box" id="loop17"></div>
        <div class="loop-box" id="loop18"></div>
        <div class="loop-box" id="loop19"></div>
        <div class="loop-box" id="loop20"></div>
        <div class="loop-box" id="loop21"></div>
        <div class="loop-box" id="loop22"></div>
        <div class="loop-box" id="loop23"></div>
        <div class="loop-box" id="loop24"></div>
    </div>
    <div id="controls">
        <div class="slider-container">
            <label for="delay-slider">Delay</label>
            <input type="range" id="delay-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-container">
            <label for="tremolo-slider">Tremolo</label>
            <input type="range" id="tremolo-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-container">
            <label for="reverb-slider">Reverb</label>
            <input type="range" id="reverb-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-container">
            <label for="filter-slider">High-pass Filter</label>
            <input type="range" id="filter-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      let effects = {
          delay: 0.5,
          tremolo: 0.5,
          reverb: 0.5,
          filter: 0.5,
      };

      // Fonction pour mettre à jour les valeurs dry/wet
      function updateEffect(effect, value) {
          effects[effect] = value;
          console.log(`Updated ${effect}: ${value}`);
          // Intégrez ici le traitement audio pour chaque effet
      }

      // Ajouter des événements pour chaque slider
      document.getElementById('delay-slider').addEventListener('input', (e) => {
          updateEffect('delay', parseFloat(e.target.value));
      });

      document.getElementById('tremolo-slider').addEventListener('input', (e) => {
          updateEffect('tremolo', parseFloat(e.target.value));
      });

      document.getElementById('reverb-slider').addEventListener('input', (e) => {
          updateEffect('reverb', parseFloat(e.target.value));
      });

      document.getElementById('filter-slider').addEventListener('input', (e) => {
          updateEffect('filter', parseFloat(e.target.value));
      });
    </script>

</body>
</html>
